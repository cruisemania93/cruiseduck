<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening CruiseMania…</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, "Segoe UI", "Noto Sans", sans-serif;
      background: linear-gradient(160deg, #0a4d8c, #0d6efd);
      color: #fff;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p  { font-size: 15px; opacity: 0.85; }
    a  {
      margin-top: 24px;
      color: #fff;
      text-decoration: underline;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <h1>🦆 CruiseMania</h1>
  <p>Taking you to the app store…</p>
  <a id="manual" href="#">Not redirected? Tap here</a>

  <script>
    // ▼▼▼ Replace only these two lines with your real app URLs ▼▼▼
    var IOS_URL     = "https://apps.apple.com/app/id6764735273";                 // iPhone App Store (no country code like /kr/)
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.cruisemania.cruise"; // Android Play Store (no &hl=... param)
    var DESKTOP_URL = "https://www.instagram.com/cruisemania_kr/";               // For desktop scanners (website / Instagram)
    // ▲▲▲ Nothing else needs editing ▲▲▲

    var ua = navigator.userAgent || navigator.vendor || window.opera;

    // iPhone / iPad detection (newer iPads report as Mac, so also check touch)
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /android/i.test(ua);

    var target = DESKTOP_URL;
    if (isIOS)          target = IOS_URL;
    else if (isAndroid) target = ANDROID_URL;

    document.getElementById("manual").href = target;
    window.location.replace(target);
  </script>
</body>
</html>
