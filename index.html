<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>크루즈매니아 앱 열기…</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(160deg, #0a4d8c, #0d6efd);
      color: #fff;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p  { font-size: 15px; opacity: 0.85; }
    a  {
      margin-top: 24px;
      color: #fff;
      text-decoration: underline;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <h1>🦆 크루즈매니아</h1>
  <p>앱 스토어로 이동 중입니다…</p>
  <a id="manual" href="#">이동이 안 되면 여기를 눌러주세요</a>

  <script>
    // ▼▼▼ 이 두 줄만 본인 앱 주소로 바꾸세요 ▼▼▼
    var IOS_URL     = "https://apps.apple.com/app/id1234567890";               // 아이폰 앱스토어 주소
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=kr.cruisemania.app"; // 안드로이드 플레이스토어 주소
    var DESKTOP_URL = "https://www.instagram.com/cruisemania_kr/";             // PC로 스캔했을 때 보낼 곳 (홈페이지·인스타 등)
    // ▲▲▲ 여기까지만 수정 ▲▲▲

    var ua = navigator.userAgent || navigator.vendor || window.opera;

    // 아이폰/아이패드 판별 (최신 아이패드는 Mac으로 잡혀서 터치까지 확인)
    var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var isAndroid = /android/i.test(ua);

    var target = DESKTOP_URL;
    if (isIOS)          target = IOS_URL;
    else if (isAndroid) target = ANDROID_URL;

    document.getElementById("manual").href = target;
    window.location.replace(target); // 자동 이동
  </script>
</body>
</html>
